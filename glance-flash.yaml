# homelab-glance — ESP32-2432S028R "CYD" desk display, ink-on-paper look.
# Reads ONE small JSON from glance-feed on Hermes over plain LAN HTTP (fast; no TLS,
# no tokens on the board). Hermes does the slow work: warden, TfL, Beszel, Kuma,
# backups, LAN scan. Tap the screen to flip pages: Warden / Buses / Homelab / Network.
# WiFi: baked in by glance-home.yaml, or set on first boot (hotspot "homelab-glance setup").
substitutions:
  feed_url: "http://192.0.2.40:8798/glance.json"
  bus_header: "BUS 20 - MAIN ST"
  bus_label_a: "to town"
  bus_label_b: "to station"
  # Board preset (ESPHome mipi_spi). The CYD comes in three flavours:
  #   ESP32-2432S028-7789  micro-USB + USB-C, ST7789V   (default)
  #   ESP32-2432S028-9342  micro-USB + USB-C, ILI9342
  #   ESP32-2432S028       micro-USB only,    ILI9341
  # Override without editing: esphome -s display_model ESP32-2432S028 run glance-flash.yaml
  # Paper looks dark / colours look negative? add -s invert_colors true (or false).
  display_model: ESP32-2432S028-7789
  invert_colors: "false"
esphome:
  name: homelab-glance
  friendly_name: Homelab Glance
  on_boot:
    priority: 600
    then:
      - light.turn_on: {id: backlight, brightness: 40%}
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
  level: INFO
wifi:
  ap:
    ssid: "homelab-glance setup"
  on_connect:
    - delay: 2s
    - script.execute: fetch
captive_portal:
improv_serial:
# Board page at http://homelab-glance.local: backlight + logs.
web_server:
  port: 80
  version: 3
# Over-the-air updates after the first USB flash (LAN only).
ota:
  - platform: esphome
# Health: reset reason + memory, visible on the board's page (survive a crash).
debug:
  update_interval: 15s
text_sensor:
  - platform: debug
    reset_reason: {name: "Reset reason"}
sensor:
  - platform: debug
    free: {name: "Heap free"}
    block: {name: "Heap largest block"}
    loop_time: {name: "Loop time"}
time:
  - platform: sntp
    id: sntp_time
globals:
  - {id: g_feed,  type: std::string, restore_value: no, initial_value: '""'}  # last good feed JSON
  - {id: g_ok,    type: bool, restore_value: no, initial_value: 'false'}      # last fetch worked
  - {id: g_fetch, type: uint32_t, restore_value: no, initial_value: '0'}      # millis() of last good fetch
  - {id: g_page,  type: int, restore_value: no, initial_value: '0'}           # 0 warden 1 buses 2 homelab 3 network
http_request:
  timeout: 3s
script:
  - id: fetch
    mode: single
    then:
      - if:
          condition:
            lambda: 'return wifi::global_wifi_component->is_connected();'
          then:
            - http_request.get:
                url: "${feed_url}"
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: |-
                        id(g_ok) = response->status_code == 200 && !body.empty() && body[0] == '{';
                        if (!id(g_ok)) return;
                        id(g_fetch) = millis();
                        if (body == id(g_feed)) return;  // nothing changed: don't redraw (no blink)
                        id(g_feed) = body;
                        id(screen).update();
                on_error:
                  then:
                    - lambda: 'id(g_ok) = false;'
interval:
  - interval: 30s
    then:
      - script.execute: fetch
font:
  - {file: "gfonts://Libre Baskerville", id: f_big, size: 38}
  - {file: "gfonts://Libre Baskerville", id: f_med, size: 20}
  - {file: "gfonts://IBM Plex Mono", id: f_small, size: 13}
# Paper, ink, faded ink, and one red ink (like a black/white/red e-paper panel).
color:
  - {id: c_paper, red: 93%, green: 91%, blue: 86%}
  - {id: c_ink,   red: 11%, green: 11%, blue: 11%}
  - {id: c_soft,  red: 47%, green: 45%, blue: 42%}
  - {id: c_red,   red: 70%, green: 16%, blue: 14%}
output:
  # 20 kHz PWM: no visible backlight flicker at low brightness.
  - {platform: ledc, pin: GPIO21, id: backlight_pwm, frequency: 20000Hz}
light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    name: Backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
spi:
  - {id: tft, clk_pin: GPIO14, mosi_pin: GPIO13, miso_pin: GPIO12}
  - {id: touch_spi, clk_pin: GPIO25, mosi_pin: GPIO32, miso_pin: GPIO39}
# Tap anywhere: next page.
touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    display: screen
    calibration: {x_min: 280, x_max: 3860, y_min: 340, y_max: 3860}
    on_touch:
      - lambda: 'id(g_page) = (id(g_page) + 1) % 4;'
      - component.update: screen
display:
  # mipi_spi draws in strips (~20 KB buffer): a full 320x240 16-bit frame (150 KB)
  # doesn't fit in RAM on this PSRAM-less ESP32 ("Could not allocate buffer for display").
  - platform: mipi_spi
    id: screen
    model: ${display_model}
    invert_colors: ${invert_colors}
    spi_id: tft
    rotation: 270
    update_interval: 60s   # only for the bus countdown; new data redraws straight away
    lambda: |-
      it.fill(id(c_paper));
      auto now = id(sntp_time).now();
      static const char *titles[] = {"WARDEN", "${bus_header}", "HOMELAB", "NETWORK"};
      int pg = id(g_page);

      if (!wifi::global_wifi_component->is_connected()) {
        it.print(16, 12, id(f_small), id(c_soft), "HOMELAB GLANCE");
        it.line(16, 34, 304, 34, id(c_ink));
        it.print(16, 56, id(f_med), id(c_ink), "Not on WiFi yet.");
        it.print(16, 96, id(f_small), id(c_soft), "On your phone, join WiFi");
        it.print(16, 114, id(f_small), id(c_ink), "homelab-glance setup");
        it.print(16, 132, id(f_small), id(c_soft), "then pick your home WiFi.");
        return;
      }

      it.print(16, 12, id(f_small), id(c_soft), titles[pg]);
      if (now.is_valid())
        it.strftime(304, 12, id(f_small), id(c_soft), TextAlign::TOP_RIGHT, "%a %d %b %H:%M", now);
      it.line(16, 34, 304, 34, id(c_ink));

      // Footer: page dots + freshness.
      for (int i = 0; i < 4; i++) {
        if (i == pg) it.filled_circle(16 + i * 14, 222, 4, id(c_ink));
        else it.circle(16 + i * 14, 222, 4, id(c_soft));
      }
      int age = id(g_fetch) ? (millis() - id(g_fetch)) / 1000 : -1;
      if (id(g_feed).empty())
        it.print(304, 214, id(f_small), id(c_soft), TextAlign::TOP_RIGHT, "waiting for Hermes...");
      else if (!id(g_ok) && age > 120)
        it.printf(304, 214, id(f_small), id(c_red), TextAlign::TOP_RIGHT, "Hermes offline %dm", age / 60);
      else
        it.print(304, 214, id(f_small), id(c_soft), TextAlign::TOP_RIGHT, "tap for next");
      if (id(g_feed).empty()) return;

      JsonDocument doc;
      if (deserializeJson(doc, id(g_feed))) return;
      // How old the feed's numbers are (feed's own clock), for the bus countdown.
      long gone = now.is_valid() ? (long) now.timestamp - (long) (doc["gen"] | 0) : age;
      if (gone < 0) gone = 0;

      auto row = [&](int y, const char *label, const char *val, bool alert) {
        it.print(16, y + 5, id(f_small), id(c_soft), label);
        it.print(120, y, id(f_med), alert ? id(c_red) : id(c_ink), val);
      };
      char v[48];

      if (pg == 0) {
        JsonObject w = doc["w"];
        if (w.isNull()) { it.print(16, 60, id(f_med), id(c_red), "warden unreachable"); return; }
        int kev = w["kev"] | 0;
        it.printf(16, 44, id(f_big), id(c_ink), "%d", (int) (w["wait"] | 0));
        it.print(16, 90, id(f_small), id(c_soft), "waiting for you");
        it.printf(172, 44, id(f_big), kev > 0 ? id(c_red) : id(c_ink), "%d", kev);
        it.print(172, 90, id(f_small), id(c_soft), "known-exploited");
        it.line(16, 112, 304, 112, id(c_soft));
        row(116, "mode", w["mode"] | "?", false);
        snprintf(v, sizeof v, "%d open", (int) (w["find"] | 0));
        row(140, "findings", v, false);
        JsonObject pt = doc["pt"];
        if (!pt.isNull()) {
          int pend = pt["pending"] | 0, nr = pt["n_reboot"] | 0;
          snprintf(v, sizeof v, "%d pending", pend);
          row(164, "patches", v, false);
          if (nr) snprintf(v, sizeof v, "%d %s", nr, (const char *) (pt["reboot"][0] | "?"));
          else snprintf(v, sizeof v, "none needed");
          row(188, "reboots", v, nr > 0);
        }
      } else if (pg == 1) {
        JsonObject b = doc["bus"];
        if (b.isNull()) { it.print(16, 60, id(f_med), id(c_red), "TfL unreachable"); return; }
        auto mins = [&](int t) { return (int) ((t - gone) / 60); };
        auto dir = [&](int y, const char *label, JsonArray t) {
          it.print(16, y, id(f_small), id(c_soft), label);
          int t0 = t[0] | -1, t1 = t[1] | -1;
          if (t0 >= 0 && t0 - gone < -30) { t0 = t1; t1 = -1; }  // first one has left
          if (t0 < 0) { it.print(16, y + 18, id(f_med), id(c_soft), "no buses"); return; }
          int m = mins(t0);
          if (m < 1) it.print(16, y + 14, id(f_big), id(c_ink), "due");
          else it.printf(16, y + 14, id(f_big), id(c_ink), "%d", m);
          it.print(m < 1 ? 100 : (m < 10 ? 50 : 76), y + 34, id(f_small), id(c_soft), m < 1 ? "" : "min");
          if (t1 >= 0) it.printf(304, y + 30, id(f_med), id(c_soft), TextAlign::TOP_RIGHT, "then %d min", mins(t1));
        };
        dir(44, "${bus_label_a}", b["a"]);
        it.line(16, 122, 304, 122, id(c_soft));
        dir(128, "${bus_label_b}", b["b"]);
      } else if (pg == 2) {
        JsonObject l = doc["lab"], k = doc["kuma"], bk = doc["bk"];
        if (!l.isNull()) {
          int up = l["up"] | 0, tot = l["total"] | 0;
          snprintf(v, sizeof v, "%d/%d up", up, tot);
          row(44, "nodes", v, up < tot);
        }
        if (!k.isNull()) {
          int up = k["up"] | 0, tot = k["total"] | 0;
          snprintf(v, sizeof v, "%d/%d up", up, tot);
          row(72, "services", v, up < tot);
        }
        if (!bk.isNull()) {
          int st = (bk["stale"] | 0) + (bk["missing"] | 0);
          if (st) snprintf(v, sizeof v, "%d need a look", st);
          else snprintf(v, sizeof v, "%d fresh", (int) (bk["fresh"] | 0));
          row(100, "backups", v, st > 0);
        }
        const char *keys[] = {"cpu", "mem", "disk"};
        for (int i = 0; i < 3; i++) {
          JsonArray a = l[keys[i]];
          if (a.isNull()) continue;
          int pct = a[1] | 0;
          snprintf(v, sizeof v, "%d%% %s", pct, (const char *) (a[0] | "?"));
          row(128 + i * 26, i == 0 ? "busiest cpu" : (i == 1 ? "mem" : "disk"), v, pct >= 90);
        }
        // What's down, if anything (nodes first, then services).
        std::string dn;
        for (JsonVariant d : l["down"].as<JsonArray>()) { dn += dn.empty() ? "" : ", "; dn += d.as<const char *>(); }
        for (JsonVariant d : k["down"].as<JsonArray>()) { dn += dn.empty() ? "" : ", "; dn += d.as<const char *>(); }
        if (!dn.empty()) it.printf(16, 200, id(f_small), id(c_red), "down: %.36s", dn.c_str());
      } else {
        JsonObject n = doc["net"], w = doc["w"];
        JsonObject in = n["inet"];
        if (!in.isNull()) {
          bool up = in["up"] | false;
          if (up) snprintf(v, sizeof v, "up  %d ms", (int) (in["ms"] | 0));
          else snprintf(v, sizeof v, "DOWN");
          row(44, "internet", v, !up || (in["loss"] | 0) > 0);
        }
        if (!n["lan"].isNull()) {
          snprintf(v, sizeof v, "%d on LAN", (int) (n["lan"]["devices"] | 0));
          row(76, "devices", v, false);
        }
        if (!w.isNull()) {
          snprintf(v, sizeof v, "%d", (int) (w["bans"] | 0));
          row(108, "bans", v, false);
          snprintf(v, sizeof v, "%d today", (int) (w["ev24"] | 0));
          row(140, "events", v, false);
        }
      }
