# homelab-glance with WiFi baked in at build time (no on-device setup).
# Values come from secrets.yaml next to this file (gitignored — never committed):
#   wifi_ssid: "YourWiFi"
#   wifi_password: "..."
# Flash with:  esphome run glance-home.yaml
# No warden token is needed on the board any more: Hermes' glance-feed fetches everything.
# The setup hotspot still appears if the WiFi is unreachable.
packages:
  glance: !include glance-flash.yaml
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
