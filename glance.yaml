# homelab-glance — ESP32-2432S028R (Cheap Yellow Display)
# Shows warden status from Home Assistant on the 2.8" screen. Starting point: verify pins/touch on your board.
substitutions:
  name: homelab-glance
  friendly_name: Homelab Glance

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
time:
  - platform: homeassistant
    id: clock

# ---- CYD hardware (ESP32-2432S028R) ----
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: tp
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: f_big
    size: 34
  - file: "gfonts://Roboto"
    id: f_med
    size: 20
  - file: "gfonts://Roboto"
    id: f_small
    size: 14

color:
  - {id: c_fg, red: 90%, green: 93%, blue: 95%}
  - {id: c_dim, red: 55%, green: 59%, blue: 62%}
  - {id: c_red, red: 97%, green: 32%, blue: 29%}
  - {id: c_amb, red: 82%, green: 60%, blue: 13%}
  - {id: c_grn, red: 25%, green: 73%, blue: 31%}
  - {id: c_acc, red: 35%, green: 65%, blue: 100%}

# ---- data from Home Assistant ----
sensor:
  - platform: homeassistant
    id: s_waiting
    entity_id: sensor.warden_waiting
  - platform: homeassistant
    id: s_kev
    entity_id: sensor.warden_known_exploited_cves
text_sensor:
  - platform: homeassistant
    id: s_mode
    entity_id: sensor.warden_mode

display:
  - platform: ili9xxx
    model: ili9341
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 270
    update_interval: 2s
    lambda: |-
      it.fill(Color::BLACK);
      it.printf(10, 6, id(f_small), id(c_acc), "C1 LAB · warden");
      // mode
      auto mode = id(s_mode).state;
      it.printf(10, 30, id(f_med), mode == "enforcing" ? id(c_amb) : id(c_grn), "%s", mode.c_str());
      // waiting for you
      int wait = (int) id(s_waiting).state;
      it.printf(10, 66, id(f_big), wait > 0 ? id(c_amb) : id(c_dim), "%d", wait);
      it.printf(70, 86, id(f_small), id(c_dim), "waiting for you");
      // known-exploited CVEs
      int kev = (int) id(s_kev).state;
      it.printf(10, 120, id(f_big), kev > 0 ? id(c_red) : id(c_grn), "%d", kev);
      it.printf(70, 140, id(f_small), id(c_dim), "known-exploited CVEs");
      // clock
      it.strftime(10, 210, id(f_small), id(c_dim), "%a %d %b  %H:%M", id(clock).now());

touchscreen:
  - platform: xpt2046
    id: tp_cal
    spi_id: tp
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    # one-time calibration — adjust after first flash:
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
